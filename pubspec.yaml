# pubspec.yaml
name: kidloop
description: Parent exchange and community app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ========== ОСНОВНЫЕ ==========
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.0
  intl: ^0.19.0

  # ========== 🔥 ЛОКАЛЬНЫЕ УВЕДОМЛЕНИЯ ==========
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # ========== 🔥 ФОНОВЫЕ ЗАДАЧИ ==========
  workmanager: ^0.5.2

  # ========== ИЗОБРАЖЕНИЯ ==========
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0

  # ========== КАРТА И ГЕО ==========
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ========== ШАГОМЕР ==========
  pedometer: ^4.1.1
  permission_handler: ^11.3.0

  # ========== СЕТЬ ==========
  connectivity_plus: ^6.0.0
  web_socket_channel: ^3.0.0

  # ========== URL И АНИМАЦИИ ==========
  url_launcher: ^6.2.5
  confetti: ^0.7.0

  # ========== 🔥 НОВЫЕ ДЛЯ СУПЕР-СОВРЕМЕННОСТИ ==========
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  animate_do: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # ========== 🔥 ДОПОЛНИТЕЛЬНЫЕ ==========
  lottie: ^3.0.0
  flutter_native_splash: ^2.4.0
  animated_bottom_navigation_bar: ^1.3.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # ========== 🔥 ДЛЯ ЖИЗНЕННОГО НАВИГАТОРА ==========
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.2.1

  # ========== 🔥 ДОПОЛНИТЕЛЬНО ДЛЯ UI ==========
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.1

  # ========== 🔥 КАМЕРА ДЛЯ ЭФФЕКТА "ЛОХ" ==========
  camera: ^0.10.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/